name: Bug report
description: Report a reproducible defect in gameplay, training, evaluation, or the web app.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for providing a minimal, reproducible report. For vulnerabilities, use SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed result and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the exact commands, configuration changes, board state, and smallest input needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the observable result you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `python -m alphazero_gomoku doctor` output and include OS, install method, device, and container tag when relevant.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or artifacts
      description: Add a traceback, sanitized log, checkpoint metadata, report JSON, or screenshot. Do not include secrets or private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find the same defect.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
