name: Feature request
description: Propose a scoped, testable improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research question
      description: Explain the user or research need before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and the public interface it affects.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Measurable acceptance criteria
      description: List deterministic tests, evidence, or observable outcomes that would prove completion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Explain alternatives considered, compute or compatibility costs, and what is intentionally out of scope.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and roadmap items.
          required: true
        - label: I can describe how this change will be tested or benchmarked.
          required: true
