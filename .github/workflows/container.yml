name: Container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "alphazero_gomoku/**"
      - "models/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "alphazero_gomoku/**"
      - "models/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build non-root web image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: alphazero-gomoku-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
